<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韩男养成中心 · 首页</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82c4">
</head>
<body>
  <main class="container">

    <!-- 轮播 Banner -->
    <div class="banner" id="banner">
      <div class="banner-slide on">
        <h2>💪 30 天韩系养成计划</h2>
        <p>防晒 + 保湿 + 早睡，把好状态变成可复制的习惯</p>
      </div>
      <div class="banner-slide">
        <h2>📅 今天进度</h2>
        <p id="bannerProgress">加载中…</p>
      </div>
      <div class="banner-slide">
        <h2>💡 每日冷知识</h2>
        <p id="bannerTip">加载中…</p>
      </div>
      <div class="banner-dots" id="bannerDots"></div>
    </div>

    <!-- 功能入口 -->
    <div class="card">
      <div class="card-head"><h2>🎯 功能入口</h2></div>
      <div class="grid-entries">
        <a class="entry" href="checkin.html"><span class="icon">✅</span><span class="label">每日打卡</span></a>
        <a class="entry" href="wiki.html"><span class="icon">📚</span><span class="label">护肤百科</span></a>
        <a class="entry" href="diary.html"><span class="icon">📝</span><span class="label">皮肤日记</span></a>
        <a class="entry" href="achievements.html"><span class="icon">🏆</span><span class="label">成就徽章</span></a>
        <a class="entry" href="quotes.html"><span class="icon">✨</span><span class="label">励志金句</span></a>
      </div>
    </div>

    <!-- 今日待办速览 -->
    <div class="card">
      <div class="card-head"><h2>✅ 今日待办</h2><a href="checkin.html" class="muted">去打卡 →</a></div>
      <ul id="todoList" style="list-style:none;"></ul>
    </div>

    <!-- 我的等级速览 -->
    <div class="card">
      <div class="card-head"><h2>🏆 我的等级</h2><a href="achievements.html" class="muted">看成就 →</a></div>
      <div id="levelSummary"></div>
    </div>

  </main>

  <script src="common.js"></script>
  <script>
    injectNav("index");

    /* 轮播 */
    const slides = document.querySelectorAll(".banner-slide");
    const dotsBox = document.getElementById("bannerDots");
    let idx = 0;
    slides.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "banner-dot" + (i === 0 ? " on" : "");
      dotsBox.appendChild(d);
    });
    setInterval(() => {
      idx = (idx + 1) % slides.length;
      slides.forEach((s, i) => s.classList.toggle("on", i === idx));
      dotsBox.querySelectorAll(".banner-dot").forEach((d, i) => d.classList.toggle("on", i === idx));
    }, 3500);

    /* 填充 Banner 数据 */
    const today = todayStr();
    const dayData = loadDay(today);
    const list = tasksFor(today);
    const done = list.filter((t) => dayData.tasks[t.id]).length;
    document.getElementById("bannerProgress").textContent =
      `已完成 ${done} / ${list.length} 项，继续加油！`;
    const meta = loadMeta();
    const dayNum = Math.floor((new Date(today) - new Date(meta.startDate)) / 86400000) + 1;
    document.getElementById("bannerTip").textContent =
      TIPS[((dayNum - 1) % TIPS.length + TIPS.length) % TIPS.length];

    /* 今日待办速览 */
    document.getElementById("todoList").innerHTML = list
      .map((t) => `<li style="padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;display:flex;justify-content:space-between;">
        <span>${t.icon} ${t.name}</span>
        <span style="color:${dayData.tasks[t.id] ? "var(--green)" : "var(--text-light)"}">${dayData.tasks[t.id] ? "✓" : "○"}</span>
      </li>`).join("");

    /* 等级速览 */
    const h = enrichHistory(calcHistory());
    const lv = levelOf(h.xp);
    document.getElementById("levelSummary").innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;">Lv ${lv}</div>
        <div style="flex:1;">
          <div style="font-weight:700;">${LEVEL_TITLES[lv - 1]}</div>
          <div class="muted">${h.xp} XP · 完美日 ${h.perfect} · 连续 ${calcStreak()} 天</div>
          ${h.checked === 0 ? '<div class="muted" style="color:var(--amber);margin-top:2px;">还没有记录，去打卡页勾下今天的第一项吧 →</div>' : ""}
        </div>
      </div>`;
  </script>
</body>
</html>
