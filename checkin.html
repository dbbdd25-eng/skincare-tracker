<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日打卡 · 韩男养成中心</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82c4">
  <style>
    /* 打卡页专属样式 */
    .level-card { background: linear-gradient(135deg, #ffffff, #f0f4ff); border: 1px solid #d7e3f7; }
    .level-row { display: flex; align-items: center; gap: 14px; }
    .level-badge {
      width: 62px; height: 62px; border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(59,130,196,.35);
    }
    .level-info { flex: 1; min-width: 0; }
    .level-title { font-size: 15px; font-weight: 700; }
    .xp-track { height: 9px; background: #e2e9f5; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .xp-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--amber), #f5c76e); transition: width .6s; }
    .xp-text { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }
    .day-badge { background: var(--primary); color: #fff; font-size: 12.5px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
    .progress-track { height: 12px; background: #eceff5; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--purple)); transition: width .6s; position: relative; overflow: hidden; }
    .progress-shine { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); animation: shine 2.2s infinite; }
    @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .progress-text { font-size: 12.5px; color: var(--text-light); margin-top: 8px; }
    .medals { display: flex; gap: 10px; margin-top: 14px; }
    .medal { flex: 1; text-align: center; font-size: 12px; color: var(--text-light); background: #f6f8fc; border-radius: 12px; padding: 10px 4px 8px; border: 1px solid var(--border); filter: grayscale(1); opacity: .55; transition: all .4s; }
    .medal.unlocked { filter: none; opacity: 1; background: var(--amber-light); border-color: var(--amber); color: #a06a12; font-weight: 700; }
    .medal-icon { display: block; font-size: 22px; margin-bottom: 2px; }
    .tip-bar { background: linear-gradient(135deg, #fffaf0, #fdf3e3); border: 1px solid #f3ddba; border-radius: 14px; padding: 12px 15px; font-size: 13px; color: #8a6420; margin-bottom: 14px; line-height: 1.55; }
    .done-count { font-size: 13px; color: var(--primary); font-weight: 700; }
    .task-list { list-style: none; }
    .task-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; border-radius: 10px; animation: taskIn .3s ease backwards; }
    @keyframes taskIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .task-item:last-child { border-bottom: none; }
    .task-item:active { background: var(--bg); }
    .task-check { width: 24px; height: 24px; border: 2px solid #c3cddd; border-radius: 8px; flex-shrink: 0; position: relative; transition: all .2s; }
    .task-item.checked .task-check { background: var(--green); border-color: var(--green); animation: pop .35s cubic-bezier(.68,-.55,.27,1.55); }
    @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
    .task-item.checked .task-check::after { content: "✓"; color: #fff; font-size: 15px; font-weight: 700; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .task-icon { font-size: 19px; flex-shrink: 0; }
    .task-body { flex: 1; min-width: 0; }
    .task-name { font-size: 14.5px; font-weight: 600; }
    .task-item.checked .task-name { text-decoration: line-through; color: var(--text-light); }
    .task-desc { font-size: 12px; color: var(--text-light); }
    .task-time { font-size: 11px; color: var(--purple); background: #eef0fd; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
    .acid-tip { font-size: 12px; color: var(--text-light); margin-top: 10px; text-align: center; }
    .stars { display: flex; justify-content: center; gap: 14px; padding: 8px 0 4px; }
    .star { font-size: 34px; cursor: pointer; filter: grayscale(1); opacity: .45; transition: transform .15s, filter .2s, opacity .2s; }
    .star.on { filter: none; opacity: 1; transform: scale(1.08); }
    .star:active { transform: scale(1.25); }
    .cal-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
    @media (max-width: 400px) { .cal-grid { grid-template-columns: repeat(6, 1fr); } }
    .cal-cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; background: #f1f4f9; color: #aab4c5; border: 1px solid var(--border); transition: transform .15s; }
    .cal-cell.future { opacity: .4; }
    .cal-cell.today { outline: 2px solid var(--primary); outline-offset: 1px; color: var(--primary); }
    .cal-cell.lv1 { background: #d9f2e5; color: #1e7a52; border-color: #b8e5d2; }
    .cal-cell.lv2 { background: #9fdebe; color: #14603e; border-color: #7fd3a7; }
    .cal-cell.lv3 { background: #34a877; color: #fff; border-color: #34a877; }
    .cal-legend { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 11px; color: var(--text-light); flex-wrap: wrap; }
    .lg { width: 12px; height: 12px; border-radius: 4px; display: inline-block; margin-left: 6px; border: 1px solid var(--border); }
    .lg-1 { background: #d9f2e5; } .lg-2 { background: #9fdebe; } .lg-3 { background: #34a877; }
    #trendSvg { width: 100%; height: 96px; display: block; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat { background: #f6f8fc; border-radius: 12px; padding: 12px 6px; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 11.5px; color: var(--text-light); }
    .week-title { font-size: 13px; color: var(--text-light); font-weight: 600; margin-bottom: 10px; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .week-cell { aspect-ratio: 1; border-radius: 10px; background: #f1f4f9; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--text-light); }
    .week-cell .pct { font-size: 10.5px; font-weight: 700; margin-top: 1px; }
    .week-cell.lv-perfect { background: var(--green); border-color: var(--green); color: #fff; }
    .week-cell.lv-good { background: var(--green-light); border-color: #b8e5d2; color: #1e7a52; }
    .week-cell.lv-partial { background: var(--amber-light); border-color: #f3ddba; color: #a06a12; }
    .week-cell.today { outline: 2px solid var(--primary); outline-offset: 1px; }
    .confetti-box { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 999; }
    .confetti-piece { position: absolute; top: -14px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(112vh) rotate(720deg); opacity: .5; } }
    .toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px); background: rgba(45,55,72,.92); color: #fff; font-size: 14px; padding: 11px 22px; border-radius: 999px; opacity: 0; pointer-events: none; transition: all .3s; white-space: nowrap; z-index: 99; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .modal-mask { position: fixed; inset: 0; background: rgba(20,28,44,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .modal-mask.open { display: flex; }
    .modal { background: #fff; border-radius: 18px; padding: 24px 20px; width: 100%; max-width: 380px; position: relative; animation: popIn .25s ease; }
    @keyframes popIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal h2 { font-size: 17px; margin-bottom: 16px; }
    .field span { display: block; font-size: 13px; margin-bottom: 6px; }
    .field input[type="date"] { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--text); outline: none; }
    .field input[type="date"]:focus { border-color: var(--primary); }
    .field-tip { font-size: 12px; color: var(--text-light); margin-top: 6px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
    .mbtn { flex: 1; padding: 11px 0; border-radius: 11px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
    .mbtn.primary { background: var(--primary); color: #fff; }
    .mbtn.danger { background: #fff; color: var(--red); border: 1.5px solid #f3c6c6; }
    .modal-close { position: absolute; top: 14px; right: 14px; border: none; background: var(--bg); width: 30px; height: 30px; border-radius: 50%; color: var(--text-light); cursor: pointer; font-size: 13px; }
    .gear-btn { background: var(--primary); color: #fff; border: none; width: 36px; height: 36px; border-radius: 11px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main class="container">

    <div class="card level-card">
      <div class="level-row">
        <div class="level-badge" id="levelBadge">Lv 1</div>
        <div class="level-info">
          <div class="level-title" id="levelTitle">初来乍到</div>
          <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
          <div class="xp-text" id="xpText">0 XP</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>🗓️ 30 天进度</h2><span class="day-badge" id="dayBadge">Day 1</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"><i class="progress-shine"></i></div></div>
      <div class="progress-text" id="progressText"></div>
      <div class="medals">
        <div class="medal" id="medal7"><span class="medal-icon">🥉</span>7 天</div>
        <div class="medal" id="medal14"><span class="medal-icon">🥈</span>14 天</div>
        <div class="medal" id="medal30"><span class="medal-icon">🥇</span>30 天</div>
      </div>
    </div>

    <div class="tip-bar" id="tipBar">💡 …</div>

    <div class="card">
      <div class="card-head"><h2>✅ 今日任务</h2><span class="done-count" id="doneCount"></span></div>
      <ul class="task-list" id="taskList"></ul>
      <p class="acid-tip" id="acidTip"></p>
    </div>

    <div class="card">
      <div class="card-head"><h2>⭐ 今日皮肤状态</h2><span class="muted">睡前评一个</span></div>
      <div class="stars" id="stars"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>📅 打卡日历</h2><span class="muted">颜色越深越完美</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span class="lg lg-0"></span>未打卡 <span class="lg lg-1"></span>部分 <span class="lg lg-2"></span>达标 <span class="lg lg-3"></span>完美
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>📈 皮肤状态趋势</h2><span class="muted">最近 14 天</span></div>
      <svg id="trendSvg" viewBox="0 0 300 90" preserveAspectRatio="none"></svg>
    </div>

    <div class="card">
      <div class="card-head"><h2>📊 我的战绩</h2></div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-num" id="streakNum">0</div><div class="stat-label">连续打卡</div></div>
        <div class="stat"><div class="stat-num" id="perfectNum">0</div><div class="stat-label">完美日</div></div>
        <div class="stat"><div class="stat-num" id="rateNum">—</div><div class="stat-label">平均完成率</div></div>
      </div>
      <div class="week-title">最近 7 天</div>
      <div class="week-grid" id="weekGrid"></div>
    </div>

    <p class="center"><button class="gear-btn" id="settingsBtn">⚙️ 设置</button></p>
  </main>

  <div class="confetti-box" id="confettiBox"></div>
  <div class="toast" id="toast"></div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <h2>⚙️ 设置</h2>
      <label class="field"><span>计划开始日期</span><input type="date" id="startDateInput"></label>
      <p class="field-tip">从这天开始算 30 天倒计时，Day 1 = 开始当天</p>
      <div class="modal-btns">
        <button class="mbtn danger" id="clearBtn">清空数据</button>
        <button class="mbtn primary" id="saveBtn">保存</button>
      </div>
      <button class="modal-close" id="closeBtn">✕</button>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    injectNav("checkin");
    const $ = (id) => document.getElementById(id);
    const CHEERS = ["皮肤在偷偷变好 ✨","自律的男人最帅 😎","韩男进度 +1%","坚持就是水光肌 💧","黑色素退退退！","今天也是精致男孩 🧴"];
    const PERFECT_CHEER = "完美打卡日达成！连续 {n} 天 🔥";

    function renderAll() {
      const meta = loadMeta();
      const today = todayStr();
      const dayData = loadDay(today);
      const dayNum = Math.floor((new Date(today) - new Date(meta.startDate)) / 86400000) + 1;
      const hist = enrichHistory(calcHistory());
      const lv = levelOf(hist.xp);
      const xpInLevel = hist.xp % XP_PER_LEVEL;

      $("levelBadge").textContent = "Lv " + lv;
      $("levelTitle").textContent = LEVEL_TITLES[lv - 1];
      $("xpFill").style.width = (lv >= 10 ? 100 : (xpInLevel / XP_PER_LEVEL) * 100) + "%";
      $("xpText").textContent = lv >= 10 ? `${hist.xp} XP · 已满级 🏆` : `${hist.xp} XP · 再得 ${XP_PER_LEVEL - xpInLevel} XP 升 Lv ${lv + 1}`;

      const dayClamped = Math.min(Math.max(dayNum, 1), 30);
      $("dayBadge").textContent = "Day " + dayClamped;
      $("progressFill").style.width = (dayClamped / 30) * 100 + "%";
      $("progressText").textContent = dayNum >= 30 ? "🎉 满月达成！" : `已完成 ${dayClamped} 天，还剩 ${30 - dayClamped} 天`;
      $("medal7").classList.toggle("unlocked", dayNum >= 7);
      $("medal14").classList.toggle("unlocked", dayNum >= 14);
      $("medal30").classList.toggle("unlocked", dayNum >= 30);

      $("tipBar").textContent = "💡 今日冷知识：" + TIPS[((dayNum - 1) % TIPS.length + TIPS.length) % TIPS.length];

      const list = tasksFor(today);
      const doneCount = list.filter((t) => dayData.tasks[t.id]).length;
      $("doneCount").textContent = `${doneCount} / ${list.length}`;
      $("taskList").innerHTML = list.map((t, i) => `
        <li class="task-item ${dayData.tasks[t.id] ? "checked" : ""}" data-id="${t.id}" style="animation-delay:${i * 0.05}s">
          <div class="task-check"></div><span class="task-icon">${t.icon}</span>
          <div class="task-body"><div class="task-name">${t.name}</div><div class="task-desc">${t.desc || ""}</div></div>
          <span class="task-time">${t.time || ""}</span>
        </li>`).join("");
      $("acidTip").textContent = acidDay(today) ? "💧 今天刷酸日：刷酸当晚跳过烟酰胺" : "今天不刷酸，每周二/周五才是刷酸日";

      renderStars(dayData.skin);
      renderCalendar(meta.startDate);
      renderTrend();
      $("streakNum").textContent = calcStreak();
      $("perfectNum").textContent = hist.perfect;
      $("rateNum").textContent = hist.avgRate === null ? "—" : Math.round(hist.avgRate * 100) + "%";
      renderWeek();
    }

    function renderStars(v) {
      $("stars").innerHTML = [1,2,3,4,5].map((n) => `<span class="star ${n <= v ? "on" : ""}" data-value="${n}">⭐</span>`).join("");
    }
    function renderCalendar(startDate) {
      const start = new Date(startDate + "T00:00:00");
      const today = todayStr();
      let html = "";
      for (let i = 0; i < 30; i++) {
        const d = new Date(start); d.setDate(d.getDate() + i);
        const ds = fmtDate(d); const data = loadDay(ds);
        const has = data.tasks && Object.keys(data.tasks).length;
        const p = has ? progressOf(ds, data) : 0;
        let cls = "";
        if (ds > today) cls = "future";
        else if (has) cls = p >= 0.999 ? "lv3" : p >= 0.8 ? "lv2" : p > 0 ? "lv1" : "";
        if (ds === today) cls += " today";
        html += `<div class="cal-cell ${cls}">${i + 1}</div>`;
      }
      $("calGrid").innerHTML = html;
    }
    function renderTrend() {
      const days = []; const base = new Date(todayStr() + "T00:00:00");
      for (let i = 13; i >= 0; i--) {
        const d = new Date(base); d.setDate(d.getDate() - i);
        const ds = fmtDate(d); const data = loadDay(ds);
        if (data.skin) days.push({ date: ds, skin: data.skin });
      }
      const svg = $("trendSvg");
      if (days.length < 2) {
        svg.innerHTML = `<text x="150" y="48" text-anchor="middle" font-size="12" fill="#8a94a6">连续评 2 天以上就能看到趋势线</text>`;
        return;
      }
      const W = 300, H = 90, pad = 10;
      const xs = days.map((_, i) => pad + (i / (days.length - 1)) * (W - pad * 2));
      const ys = days.map((d) => H - pad - ((d.skin - 1) / 4) * (H - pad * 2));
      const pts = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
      svg.innerHTML = `
        <polyline points="${pts}" fill="none" stroke="#3b82c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${xs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="#fff" stroke="#3b82c4" stroke-width="2"/>`).join("")}
        <text x="${pad}" y="${H - 1}" font-size="9" fill="#8a94a6">${days[0].date.slice(5)}</text>
        <text x="${W - pad}" y="${H - 1}" font-size="9" fill="#8a94a6" text-anchor="end">${days[days.length - 1].date.slice(5)}</text>`;
    }
    function renderWeek() {
      const cells = []; const base = new Date(todayStr() + "T00:00:00");
      for (let i = 6; i >= 0; i--) {
        const d = new Date(base); d.setDate(d.getDate() - i);
        const ds = fmtDate(d); const data = loadDay(ds);
        const has = data.tasks && Object.keys(data.tasks).length;
        const p = has ? progressOf(ds, data) : 0;
        let lv = "";
        if (has) { if (p >= 0.999) lv = "lv-perfect"; else if (p >= 0.8) lv = "lv-good"; else lv = "lv-partial"; }
        const isToday = ds === todayStr();
        const week = ["日","一","二","三","四","五","六"];
        cells.push(`<div class="week-cell ${lv} ${isToday ? "today" : ""}"><span>${isToday ? "今" : week[d.getDay()]}</span><span class="pct">${has ? Math.round(p * 100) + "%" : "·"}</span></div>`);
      }
      $("weekGrid").innerHTML = cells.join("");
    }

    let toastTimer;
    function toast(msg) {
      const el = $("toast"); el.textContent = msg; el.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }
    function confetti() {
      const colors = ["#3b82c4","#5b6ee8","#34a877","#f0a13a","#e05252","#8b5cf6"];
      const box = $("confettiBox"); box.innerHTML = "";
      for (let i = 0; i < 70; i++) {
        const p = document.createElement("div"); p.className = "confetti-piece";
        p.style.left = Math.random() * 100 + "%";
        p.style.background = colors[i % colors.length];
        p.style.animationDelay = Math.random() * 0.6 + "s";
        p.style.animationDuration = 1.4 + Math.random() * 1.2 + "s";
        p.style.transform = "rotate(" + Math.random() * 360 + "deg)";
        box.appendChild(p);
      }
      setTimeout(() => (box.innerHTML = ""), 3500);
    }

    $("taskList").addEventListener("click", (e) => {
      const item = e.target.closest(".task-item"); if (!item) return;
      const today = todayStr(); const data = loadDay(today); const id = item.dataset.id;
      const hour = new Date().getHours();
      if (id === "sleep" && hour < 20 && !data.tasks[id]) toast("这么早就睡？勾之前问问自己 😏");
      if (id === "sunscreen" && hour >= 19 && !data.tasks[id]) toast("这个点才涂防晒，防的是月亮吗 🌙");
      data.tasks[id] = !data.tasks[id];
      saveDay(today, data);
      renderAll();
      if (data.tasks[id]) {
        const list = tasksFor(today);
        const done = list.filter((t) => data.tasks[t.id]).length;
        if (done === list.length) { confetti(); toast(PERFECT_CHEER.replace("{n}", calcStreak())); }
        else toast(CHEERS[Math.floor(Math.random() * CHEERS.length)]);
      }
    });

    $("stars").addEventListener("click", (e) => {
      const star = e.target.closest(".star"); if (!star) return;
      const value = Number(star.dataset.value);
      const today = todayStr(); const data = loadDay(today);
      data.skin = data.skin === value ? 0 : value;
      saveDay(today, data); renderStars(data.skin); renderTrend();
      if (value) toast(`今日皮肤 ${value} 星 📝`);
    });

    const modal = $("modalMask");
    $("settingsBtn").addEventListener("click", () => { $("startDateInput").value = loadMeta().startDate || todayStr(); modal.classList.add("open"); });
    $("closeBtn").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });
    $("saveBtn").addEventListener("click", () => {
      const v = $("startDateInput").value; if (!v) return toast("先选个日期");
      saveMeta({ startDate: v }); modal.classList.remove("open"); renderAll(); toast("已保存 ✅");
    });
    $("clearBtn").addEventListener("click", () => {
      if (!confirm("确定清空所有打卡记录？")) return;
      if (!confirm("再问一遍：真的全删吗？")) return;
      Object.keys(localStorage).filter((k) => k.startsWith("sc_")).forEach((k) => localStorage.removeItem(k));
      renderAll(); modal.classList.remove("open"); toast("已清空");
    });

    (function init() {
      if (!loadMeta().startDate) saveMeta({ startDate: todayStr() });
      renderAll();
    })();
  </script>
</body>
</html>
